# The Extractor of the asynchronous ELT (docs/design-async-elt.md). Everything you may want to change is
# here; the agent file names no database, no broker and no secret.

[runtime]
timeout_seconds = 60
max_loop_turns = 1000000          # a big table has many pages: the loop of the Extractor has one turn for each

# The model of the optional step of the Worker (enricher.ag). Only a job that has a budget uses it. The key is read
# from the variable named here, never written in this file. A server of your own that speaks the chat format of
# OpenAI works too (provider = "openai-compatible" and base_url).
[llm]
provider = "anthropic"
model = "claude-sonnet-5-5"
api_key_env = "ANTHROPIC_API_KEY"

# ---- the source: read only. The demo is a SQLite file; see the notes at the end for the others. ----
[sql.source]
driver = "sqlite"
path = "demo/source.db"           # relative to this folder

[sql.source.statements]
# One page of the table, by key. `document` is masked here, in the SELECT itself: what the SELECT does
# not give never leaves the source. Keep the columns in the same order as `columns` in extractor.ag.
page = "SELECT id, customer, '***' || substr(document, -4) AS document, total, note FROM orders WHERE id > :after ORDER BY id LIMIT :size"
# The same rows again, by the edges that the outbox saved: how a batch is built again after a restart.
range = "SELECT id, customer, '***' || substr(document, -4) AS document, total, note FROM orders WHERE id > :after AND id <= :upto ORDER BY id"

# ---- the outbox: a small SQLite file on this machine; the Extractor writes it. ----
[sql.outbox]
driver = "sqlite"
path = "state/outbox.db"
mode = "write"

[sql.outbox.statements]
version = { sql = "SELECT schema_version FROM outbox_meta", result = "value" }
# A value that came from the command line is a text: these make it a whole number, and halve it.
int = { sql = "SELECT CAST(:n AS INTEGER)", result = "value" }
half = { sql = "SELECT max(1, CAST(:n AS INTEGER) / 2)", result = "value" }
next_seq = { sql = "SELECT coalesce(max(seq), 0) + 1 FROM outbox WHERE job_id = :job", result = "value" }
last_upto = { sql = "SELECT coalesce(max(upto_key), 0) FROM outbox WHERE job_id = :job", result = "value" }
# A batch that was planned and never confirmed by the broker.
next_planned = { sql = "SELECT seq, after_key, upto_key FROM outbox WHERE job_id = :job AND state = 'planned' ORDER BY seq LIMIT 1", result = "row" }
plan = "INSERT INTO outbox (job_id, seq, after_key, upto_key, row_count, state) VALUES (:job, :seq, :after_key, :upto_key, :row_count, 'planned')"
confirm = "UPDATE outbox SET state = 'published', published_at = CURRENT_TIMESTAMP WHERE job_id = :job AND seq = :seq AND state = 'planned'"
# The edges of a batch that was sent, to build it again when the destination asks.
edges = { sql = "SELECT after_key, upto_key FROM outbox WHERE job_id = :job AND seq = :seq", result = "row" }
totals = { sql = "SELECT count(*) AS batches, coalesce(sum(row_count), 0) AS rows FROM outbox WHERE job_id = :job", result = "row" }

# ---- the destination: written by the Worker (worker.ag). The demo is a SQLite file; the same statements are
# in metagente.postgres.toml for PostgreSQL. The tables are made by migrations/destination.*.sql. ----
[sql.dest]
driver = "sqlite"
path = "dest/warehouse.db"
mode = "write"

[sql.dest.statements]
version = { sql = "SELECT schema_version FROM etl_meta", result = "value" }
batch_state = { sql = "SELECT state FROM etl_batches WHERE job_id = :job AND seq = :seq", result = "value" }
batch_counts = { sql = "SELECT rows_read, rows_loaded, rows_rejected FROM etl_batches WHERE job_id = :job AND seq = :seq", result = "row" }
job_state = { sql = "SELECT state FROM etl_jobs WHERE job_id = :job", result = "value" }
# A job that is not known yet gives nothing; a job that a brake stopped says why.
job_status = { sql = "SELECT state, coalesce(pause_reason, '') AS reason FROM etl_jobs WHERE job_id = :job", result = "row" }

# Transaction 1, "land": the rows go to staging and the batch is marked, all or nothing. A copy of a row is harmless.
open_job = "INSERT INTO etl_jobs (job_id) VALUES (:job) ON CONFLICT (job_id) DO NOTHING"
land = { sql = "INSERT INTO stg_orders (job_id, seq, source_key, customer, document, total, note) VALUES (:job, :seq, :id, :customer, :document, :total, :note) ON CONFLICT (job_id, seq, source_key) DO NOTHING", each = "rows", columns = ["id", "customer", "document", "total", "note"] }
mark_landed = "INSERT INTO etl_batches (job_id, seq, state, rows_read) VALUES (:job, :seq, 'landed', :row_count) ON CONFLICT (job_id, seq) DO NOTHING"

# The model step (optional, and only for a job that has a budget). Only `id` and `note` leave staging for the
# model, and only the notes that have no answer yet (and that were tried less than twice): a new try does what is
# missing, so a paid answer is never asked for again. The answer is one of four words, whatever the model says.
pending_enrich = "SELECT source_key AS id, substr(note, 1, 200) AS note FROM stg_orders WHERE job_id = :job AND seq = :seq AND note IS NOT NULL AND trim(note) <> '' AND enrich_version IS NULL AND enrich_tries < 2 ORDER BY source_key LIMIT :group"
answer_rows = { sql = "UPDATE stg_orders SET note_category = CASE WHEN :category IN ('gift', 'delivery', 'complaint', 'other') THEN :category ELSE 'other' END, enrich_version = :version WHERE job_id = :job AND seq = :seq AND source_key = CAST(:id AS INTEGER) AND note IS NOT NULL AND enrich_version IS NULL", each = "answers", columns = ["id", "category"] }
bump_tries = { sql = "UPDATE stg_orders SET enrich_tries = enrich_tries + 1 WHERE job_id = :job AND seq = :seq AND source_key = :id", each = "group", columns = ["id"] }
count_model = "UPDATE etl_batches SET model_calls = model_calls + (CAST(:after_calls AS INTEGER) - CAST(:before_calls AS INTEGER)), model_tokens = model_tokens + (CAST(:after_tokens AS INTEGER) - CAST(:before_tokens AS INTEGER)), enrich_version = :version WHERE job_id = :job AND seq = :seq"
# What is left of the budget of the job (the sum of what its batches saved), and how much of it is spent.
model_room = { sql = "SELECT CASE WHEN j.max_model_calls IS NULL OR j.max_model_tokens IS NULL THEN 0 ELSE 1 END AS enabled, j.max_model_calls - (SELECT coalesce(sum(b.model_calls), 0) FROM etl_batches b WHERE b.job_id = j.job_id) AS calls_left, j.max_model_tokens - (SELECT coalesce(sum(b.model_tokens), 0) FROM etl_batches b WHERE b.job_id = j.job_id) AS tokens_left, CASE WHEN coalesce(j.max_model_calls, 0) = 0 OR coalesce(j.max_model_tokens, 0) = 0 THEN 0 ELSE max(100.0 * (SELECT coalesce(sum(b.model_calls), 0) FROM etl_batches b WHERE b.job_id = j.job_id) / j.max_model_calls, 100.0 * (SELECT coalesce(sum(b.model_tokens), 0) FROM etl_batches b WHERE b.job_id = j.job_id) / j.max_model_tokens) END AS percent FROM etl_jobs j WHERE j.job_id = :job", result = "row" }
warn_budget = "UPDATE etl_jobs SET budget_warned = 1 WHERE job_id = :job AND budget_warned = 0"
set_budget = "UPDATE etl_jobs SET max_model_calls = :max_calls, max_model_tokens = :max_tokens WHERE job_id = :job"

# The rules of the transformation. A row that breaks one goes to etl_rejects with a code, and the batch goes on.
# `reject_share` counts the same rules, to tell the brake how much of a batch would be rejected.
reject_share = { sql = "SELECT coalesce(100.0 * sum(CASE WHEN total < 0 OR trim(customer) = '' THEN 1 ELSE 0 END) / count(*), 0) FROM stg_orders WHERE job_id = :job AND seq = :seq", result = "value" }

# Transaction 2, "transform": rejects, the upsert into the final table, and the batch marked done, all or nothing.
reject_negative = "INSERT INTO etl_rejects (job_id, seq, source_key, reason_code) SELECT job_id, seq, source_key, 'TOTAL_NEGATIVE' FROM stg_orders WHERE job_id = :job AND seq = :seq AND total < 0 ON CONFLICT DO NOTHING"
reject_customer = "INSERT INTO etl_rejects (job_id, seq, source_key, reason_code) SELECT job_id, seq, source_key, 'CUSTOMER_EMPTY' FROM stg_orders WHERE job_id = :job AND seq = :seq AND trim(customer) = '' ON CONFLICT DO NOTHING"
load_orders = "INSERT INTO orders_final (id, customer, document_tail, total_cents, note_category, loaded_job) SELECT source_key, trim(customer), substr(document, -4), CAST(round(total * 100) AS INTEGER), note_category, job_id FROM stg_orders WHERE job_id = :job AND seq = :seq AND total >= 0 AND trim(customer) <> '' ON CONFLICT (id) DO UPDATE SET customer = excluded.customer, document_tail = excluded.document_tail, total_cents = excluded.total_cents, note_category = excluded.note_category, loaded_job = excluded.loaded_job, loaded_at = CURRENT_TIMESTAMP"
finish_batch = "UPDATE etl_batches SET state = 'done', rows_rejected = (SELECT count(DISTINCT source_key) FROM etl_rejects WHERE job_id = :job AND seq = :seq), rows_loaded = rows_read - (SELECT count(DISTINCT source_key) FROM etl_rejects WHERE job_id = :job AND seq = :seq), done_at = CURRENT_TIMESTAMP, transform_version = :version, last_error_code = NULL WHERE job_id = :job AND seq = :seq"

# A batch that a brake stopped, and the brake of the whole job: when the last three batches (by their number) are
# all stopped, the job is paused, because a rate of rejection that high is a change in the source and not bad luck.
fail_batch = "UPDATE etl_batches SET state = 'failed', failed_at = CURRENT_TIMESTAMP, attempts = attempts + 1, last_error_code = :code WHERE job_id = :job AND seq = :seq AND state <> 'done'"
pause_if_failing = "UPDATE etl_jobs SET state = 'paused', pause_reason = 'QUALITY' WHERE job_id = :job AND state = 'running' AND (SELECT count(*) FROM (SELECT state FROM etl_batches WHERE job_id = :job ORDER BY seq DESC LIMIT 3) last_three WHERE state = 'failed') = 3"
pause_job = "UPDATE etl_jobs SET state = 'paused', pause_reason = :reason WHERE job_id = :job AND state = 'running'"
resume_job = "UPDATE etl_jobs SET state = 'running', pause_reason = NULL WHERE job_id = :job AND state = 'paused'"

# The end of a job: the totals the Extractor announced, and the one conditional UPDATE that closes it (two Workers
# that try at the same time close it once). It is `done` when every batch is done and the rows add up.
set_totals = "UPDATE etl_jobs SET total_batches = :batches, total_rows = :rows, totals_at = CURRENT_TIMESTAMP WHERE job_id = :job"
try_close = "UPDATE etl_jobs SET state = CASE WHEN (SELECT coalesce(sum(rows_loaded + rows_rejected), 0) FROM etl_batches WHERE job_id = :job AND state = 'done') = total_rows THEN 'done' ELSE 'mismatch' END, finished_at = CURRENT_TIMESTAMP WHERE job_id = :job AND state = 'running' AND total_batches IS NOT NULL AND (SELECT count(*) FROM etl_batches WHERE job_id = :job AND state = 'done') = total_batches"

# Staging holds the rows as they came, so it is cleaned: the batches done more than N days ago.
purge = "DELETE FROM stg_orders WHERE EXISTS (SELECT 1 FROM etl_batches b WHERE b.job_id = stg_orders.job_id AND b.seq = stg_orders.seq AND b.state = 'done' AND b.done_at < datetime('now', '-' || CAST(:days AS INTEGER) || ' days'))"

# The control tables are cleaned too: the jobs that are `done`, ended more than N days ago and have nothing left in staging.
# A job that is paused, mismatched or has a batch that failed is for a person, so it stays. The jobs go last, and all in one
# transaction, so that a job is never left half cleaned. The final table is never touched.
old_alerts = "DELETE FROM etl_alerts WHERE job_id IN (SELECT j.job_id FROM etl_jobs j WHERE j.state = 'done' AND j.finished_at < datetime('now', '-' || CAST(:days AS INTEGER) || ' days') AND NOT EXISTS (SELECT 1 FROM stg_orders s WHERE s.job_id = j.job_id))"
old_incidents = "DELETE FROM etl_incidents WHERE job_id IN (SELECT j.job_id FROM etl_jobs j WHERE j.state = 'done' AND j.finished_at < datetime('now', '-' || CAST(:days AS INTEGER) || ' days') AND NOT EXISTS (SELECT 1 FROM stg_orders s WHERE s.job_id = j.job_id))"
old_resends = "DELETE FROM etl_resends WHERE job_id IN (SELECT j.job_id FROM etl_jobs j WHERE j.state = 'done' AND j.finished_at < datetime('now', '-' || CAST(:days AS INTEGER) || ' days') AND NOT EXISTS (SELECT 1 FROM stg_orders s WHERE s.job_id = j.job_id))"
old_rejects = "DELETE FROM etl_rejects WHERE job_id IN (SELECT j.job_id FROM etl_jobs j WHERE j.state = 'done' AND j.finished_at < datetime('now', '-' || CAST(:days AS INTEGER) || ' days') AND NOT EXISTS (SELECT 1 FROM stg_orders s WHERE s.job_id = j.job_id))"
old_batches = "DELETE FROM etl_batches WHERE job_id IN (SELECT j.job_id FROM etl_jobs j WHERE j.state = 'done' AND j.finished_at < datetime('now', '-' || CAST(:days AS INTEGER) || ' days') AND NOT EXISTS (SELECT 1 FROM stg_orders s WHERE s.job_id = j.job_id))"
old_jobs = "DELETE FROM etl_jobs WHERE job_id IN (SELECT j.job_id FROM etl_jobs j WHERE j.state = 'done' AND j.finished_at < datetime('now', '-' || CAST(:days AS INTEGER) || ' days') AND NOT EXISTS (SELECT 1 FROM stg_orders s WHERE s.job_id = j.job_id))"

# An event the Worker refused for what it is (a code and a place, never the content): the sweeper tells the team.
record_incident = "INSERT INTO etl_incidents (job_id, seq, code) VALUES (:job, :seq, :code) ON CONFLICT DO NOTHING"

# ---- for the sweeper (sweeper.ag), which reads these tables from time to time ----
# What a person should know about: a job that a brake paused, a job whose rows do not add up, a budget at 80 percent,
# a batch that was stopped, an event that was refused, and a batch that stayed landed for more than N minutes.
alert_candidates = "SELECT job_id AS job, 'JOB_PAUSED' AS kind, coalesce(pause_reason, '') AS ref FROM etl_jobs WHERE state = 'paused' UNION ALL SELECT job_id, 'JOB_MISMATCH', '' FROM etl_jobs WHERE state = 'mismatch' UNION ALL SELECT job_id, 'BUDGET_80_PERCENT', '' FROM etl_jobs WHERE budget_warned = 1 UNION ALL SELECT job_id, 'BATCH_FAILED', CAST(seq AS TEXT) FROM etl_batches WHERE state = 'failed' UNION ALL SELECT job_id, 'EVENT_REFUSED', CAST(seq AS TEXT) || ' ' || code FROM etl_incidents UNION ALL SELECT job_id, 'BATCH_STUCK', CAST(seq AS TEXT) FROM etl_batches WHERE state = 'landed' AND landed_at < datetime('now', '-' || CAST(:minutes AS INTEGER) || ' minutes') ORDER BY job, kind, ref LIMIT 200"
remember_alert = "INSERT INTO etl_alerts (job_id, kind, ref) VALUES (:job, :kind, :ref) ON CONFLICT DO NOTHING"
forget_alerts = "DELETE FROM etl_alerts WHERE job_id = :job AND kind IN ('JOB_PAUSED', 'BATCH_FAILED', 'BATCH_STUCK')"
# The batches of a running job that stayed landed or failed for more than N minutes, and were tried less than 3 times.
stuck_batches = "SELECT b.job_id AS job, b.seq AS seq, b.attempts AS attempts FROM etl_batches b JOIN etl_jobs j ON j.job_id = b.job_id WHERE j.state = 'running' AND b.attempts < 3 AND ((b.state = 'landed' AND b.landed_at < datetime('now', '-' || CAST(:minutes AS INTEGER) || ' minutes')) OR (b.state = 'failed' AND b.failed_at < datetime('now', '-' || CAST(:minutes AS INTEGER) || ' minutes'))) ORDER BY b.job_id, b.seq LIMIT 50"
bump_attempts = "UPDATE etl_batches SET attempts = attempts + 1 WHERE job_id = :job AND seq = :seq AND state IN ('landed', 'failed')"
# The jobs that announced more batches than arrived, a while ago, and which numbers are missing.
lost_jobs = "SELECT j.job_id AS job FROM etl_jobs j WHERE j.state = 'running' AND j.total_batches IS NOT NULL AND j.totals_at < datetime('now', '-' || CAST(:minutes AS INTEGER) || ' minutes') AND (SELECT count(*) FROM etl_batches b WHERE b.job_id = j.job_id) < j.total_batches ORDER BY j.job_id LIMIT 50"
missing_batches = "WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < (SELECT total_batches FROM etl_jobs WHERE job_id = :job)) SELECT i AS seq FROM n WHERE i NOT IN (SELECT seq FROM etl_batches WHERE job_id = :job) AND (SELECT total_batches FROM etl_jobs WHERE job_id = :job) IS NOT NULL ORDER BY i LIMIT 50"
# Asking for a batch to be sent again is limited: five times, and then a person looks.
request_resend = "INSERT INTO etl_resends (job_id, seq, requests) VALUES (:job, :seq, 1) ON CONFLICT (job_id, seq) DO UPDATE SET requests = requests + 1 WHERE etl_resends.requests < 5"
resend_number = { sql = "SELECT requests FROM etl_resends WHERE job_id = :job AND seq = :seq", result = "value" }

[sql.dest.transactions]
land_batch = ["open_job", "land", "mark_landed"]
save_enrichment = ["answer_rows", "bump_tries", "count_model"]
transform_batch = ["reject_negative", "reject_customer", "load_orders", "finish_batch"]
register_totals = ["open_job", "set_totals"]
open_budget = ["open_job", "set_budget"]
resume = ["resume_job", "forget_alerts"]
purge_control = ["old_alerts", "old_incidents", "old_resends", "old_rejects", "old_batches", "old_jobs"]

# ---- the broker: a NATS server with JetStream. ----
[broker.main]
driver = "jetstream"
url = "nats://127.0.0.1:4222"     # for a broker that is not on this computer: "tls://broker.example.com:4222"
stream = "ETL"                    # a stream that takes etl.> ; it has the limits of age and bytes, and discards new

# A broker with a user and a password: add `user = "extractor"` above and, here, the NAME of the variable
# that holds the password (the tool is called `events` in extractor.ag):
#
# [credentials]
# events = "BROKER_PASSWORD"

# ---- notes ----
# For a source that is PostgreSQL, MySQL, MariaDB, SQL Server or Oracle, take the section [sql.source] of
# sources/source.<database>.toml, with the two statements already written. To write them yourself, change [sql.source] to
#
#   driver = "postgres"
#   host = "db.example.com"
#   database = "orders"
#   user = "extractor"            # a user that may only read
#
# put the password in [credentials] under the name of the tool (`source = "SOURCE_DB_PASSWORD"`), and
# write the two statements in the dialect of that database.
