# The source of the Extractor for SQL Server. Use it in place of the section [sql.source] of metagente.toml (from
# `[sql.source]` to the line before `# ---- the outbox`), and put the password of the user in [credentials]
# under the name of the tool: `source = "SOURCE_DB_PASSWORD"`. The user of the source needs only to read.
# The table is made by migrations/demo-source.sqlserver.sql here, or is your own: keep the columns and their order.
[sql.source]
driver = "sqlserver"
host = "db.example.com"
database = "orders"
user = "extractor"                # a user that may only read

[sql.source.statements]
# `document` is masked in the SELECT itself, and `total` is a number of the language in every dialect.
page = "SELECT TOP (:size) id, customer, '***' + RIGHT(document, 4) AS document, CAST(total AS float) AS total, note FROM orders WHERE id > :after ORDER BY id"
range = "SELECT id, customer, '***' + RIGHT(document, 4) AS document, CAST(total AS float) AS total, note FROM orders WHERE id > :after AND id <= :upto ORDER BY id"
