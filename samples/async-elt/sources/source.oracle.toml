# The source of the Extractor for Oracle. Use it in place of the section [sql.source] of metagente.toml (from
# `[sql.source]` to the line before `# ---- the outbox`), and put the password of the user in [credentials]
# under the name of the tool: `source = "SOURCE_DB_PASSWORD"`. The user of the source needs only to read.
# The table is made by migrations/demo-source.oracle.sql here, or is your own: keep the columns and their order.
[sql.source]
driver = "oracle"
host = "db.example.com"
database = "ORCLPDB1"
user = "extractor"                # a user that may only read

[sql.source.statements]
# `document` is masked in the SELECT itself, and `total` is a number of the language in every dialect.
# Oracle gives the names of columns in capitals unless they are quoted, and the `database` is the name of the service.
page = "SELECT id AS \"id\", customer AS \"customer\", '***' || SUBSTR(document, -4) AS \"document\", CAST(total AS BINARY_DOUBLE) AS \"total\", note AS \"note\" FROM orders WHERE id > :after ORDER BY id FETCH FIRST :size ROWS ONLY"
range = "SELECT id AS \"id\", customer AS \"customer\", '***' || SUBSTR(document, -4) AS \"document\", CAST(total AS BINARY_DOUBLE) AS \"total\", note AS \"note\" FROM orders WHERE id > :after AND id <= :upto ORDER BY id"
