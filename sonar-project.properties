# The analysis of SonarQube Cloud (sonarcloud.io), run by the job "Sonar" of .github/workflows/ci.yml,
# which sends the coverage of the tests with it. The Automatic Analysis of the site has to be off.
sonar.organization=ribeiro
sonar.projectKey=Ribeiro_metagente-go

# What the tests cover: the profile that the job writes with go test -coverprofile.
sonar.go.coverage.reportPaths=coverage.out

# The program: the Go code of cmd/ and internal/, and the shell scripts of scripts/ and samples/.
sonar.sources=.
sonar.exclusions=\
  **/*_test.go,\
  spikes/**,\
  **/testdata/**,\
  validation/**,\
  bin/**

# The tests, apart from the program: rules for tests, and no duplication counted against them.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=spikes/**

# A table of cases in a test looks like a copy of the next one; it is not.
sonar.cpd.exclusions=**/*_test.go

# What is left out, and why:
# - spikes/: another module, of experiments that decided the libraries; not part of the program.
# - testdata/: example agents copied from the Rust project, the scripts of the acceptance tests and
#   the record of the language (a golden file of 750 KB): data, not code.
# - validation/: the clients in Python and JavaScript and the files used to check Metagente by hand
#   against real programs (validation/README.md); they run outside of it.
# - bin/: what make builds.
