name: CI

# It runs for every change, also of the documents only, so that the job "CI passed" always reports and a
# rule of the branch can require it. What changes only documents skips the tests (see `changes`).
on:
  push:
    branches: [master, main]
  pull_request:
  # In a private repository a minute of macOS costs ten minutes of the monthly allowance, and a minute
  # of Windows two. So there macOS runs once a week and when it is asked for (Actions tab, "Run
  # workflow"); in a public one, where the minutes cost nothing, at every change too.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# The workflow reads the code and nothing else: it has no right to write to the repository.
permissions:
  contents: read

# A new push to the same branch makes the run that is going obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the change touches more than the documents (.md, LICENSE, NOTICE). The weekly run and the
  # one asked for always test.
  changes:
    name: What changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true
          if [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; then
            if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              if ! git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '(\.md|^LICENSE|^NOTICE)$'; then
                code=false
              fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

  # What does not depend on the system: the format, the modules and go vet.
  lint:
    name: Format, modules and vet
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    # Linux is pinned to a version, here and in release.yml: ubuntu-latest moves to a new version of
    # Ubuntu on a date of GitHub, and a change of system should come in a change of this file, where
    # it can be seen and tested, not on its own. Move all of them together.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The folder spikes/ is another module, of experiments, and is not part of the program.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go' | grep -v '^spikes/'))"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt (run: make fmt):"
            echo "$unformatted"
            exit 1
          fi
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      # The vulnerabilities known in the standard library and in the modules, that the code reaches. The
      # version of Go comes from the toolchain line of go.mod: a new fix of Go turns this red until it is
      # raised there.
      - name: Known vulnerabilities (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Linux and Windows, at every push. The program starts other programs, closes them as a group,
  # follows links between folders and writes files, so what it does is not the same on each system.
  test:
    name: Test on ${{ matrix.os }}
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # A job that fails does not stop the other: the two systems report separately.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            race: true
          # The race detector of Windows needs a C compiler, and the tests of the groups of
          # processes and of the links between folders were written for Linux and macOS first.
          - os: windows-latest
            race: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Versions
        run: |
          go version
          go env GOOS GOARCH CGO_ENABLED
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test -count=1 ${{ matrix.race && '-race' || '' }} ./...
      - name: Without the SQLite driver (-tags nosqlite)
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          go vet -tags nosqlite ./...
          go test -count=1 -tags nosqlite ./internal/tools ./internal/config ./internal/lang
      - name: Acceptance tests (the binary, through the scripts of testdata/script)
        run: go test -count=1 -tags acceptance ./internal/acceptance/...
      # A green job does not say what it did not run. Where the tests skip themselves (the links between
      # folders, for example), the list is here. What has a build constraint for other systems, such as
      # the test of the groups of processes, is not compiled and does not appear at all.
      - name: What was skipped here
        if: ${{ !matrix.race }}
        run: go test -count=1 -v ./... | grep -E -- '--- SKIP' || true
      # What runs things at the same time is repeated: a race shows up once in a few runs.
      - name: Concurrency, repeated
        if: ${{ matrix.race }}
        run: go test -race -count=3 ./internal/serve ./internal/cli ./internal/runtime ./internal/mcp
      # The binaries of every system are built here, because each job builds only the one of its own.
      - name: Binaries for every system
        if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: make dist VERSION=0.0.0-ci

  # macOS: once a week and on request; in a public repository, at every change too. It is the system of
  # the computer where the program is written, so it is the one that is already tested at every change.
  test-macos:
    name: Test on macOS
    needs: changes
    if: >-
      ${{ needs.changes.outputs.code == 'true' && (github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' || github.event.repository.private == false) }}
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test -race -count=1 ./...
      - name: Acceptance tests (the binary, through the scripts of testdata/script)
        run: go test -count=1 -tags acceptance ./internal/acceptance/...
      - name: Concurrency, repeated
        run: go test -race -count=3 ./internal/serve ./internal/cli ./internal/runtime ./internal/mcp

  # The analysis of SonarQube Cloud, with the coverage of the tests (sonar-project.properties). It needs
  # the secret SONAR_TOKEN, which GitHub does not give to a pull request from a fork or from Dependabot:
  # then the analysis is skipped, not failed. It is not part of "CI passed": SonarQube Cloud reports its
  # own check on the pull request.
  sonar:
    name: Sonar
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the history tells SonarQube Cloud what is new code
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tests with coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        # -coverpkg counts what a test of one package covers in the others too.
        run: go test -count=1 -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        # Pinned to the commit of v8.3.0: the action receives the token.
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
      - name: Without the token
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN is not available here (a fork, Dependabot, or not set yet), so there is no analysis."

  # The one job a rule of the branch requires: green when every test passed or did not need to run.
  # A test that failed or was cancelled makes it red. macOS counts only when it ran.
  ci-passed:
    name: CI passed
    needs: [changes, lint, test, test-macos]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "A job ended with: $result"; exit 1 ;;
            esac
          done
