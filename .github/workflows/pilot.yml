name: Pilot

# The pilot of the asynchronous ELT (docs/design-async-elt.md, section 14). It starts real servers in containers,
# makes a table of synthetic orders, runs the Extractor and one, two and four Workers, injects the failures of the
# design, and writes what it measured in the summary of the run. It is not part of the tests of every change.
#
# Run it by hand: Actions tab, "Pilot", "Run workflow". When the files of the pilot itself change, it also runs on
# the pull request with a small table, to show that the pilot works.
on:
  workflow_dispatch:
    inputs:
      rows:
        description: Rows of the source (100 to 500 thousand)
        default: '100000'
      workers:
        description: Numbers of Workers of the clean runs
        default: '1,2,4'
      scenarios:
        description: baseline, kill, pause-destination, pause-broker, bad-rows
        default: 'baseline,kill,pause-destination,pause-broker,bad-rows'
      batch_rows:
        description: Most rows of a page
        default: '1000'
      batch_bytes:
        description: Size a batch aims at, in bytes
        default: '262144'
      pause_seconds:
        description: Seconds that the destination and the broker are frozen
        default: '20'
  pull_request:
    paths:
      - integration/pilot_test.go
      - .github/workflows/pilot.yml

permissions:
  contents: read

concurrency:
  group: pilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot:
    name: Pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      METAGENTE_IT_REGISTRY: mirror.gcr.io/
      # On a pull request the table is small, but big enough for the kill and the freezes to happen while the Workers work.
      METAGENTE_PILOT_ROWS: ${{ github.event_name == 'workflow_dispatch' && inputs.rows || '30000' }}
      METAGENTE_PILOT_WORKERS: ${{ github.event_name == 'workflow_dispatch' && inputs.workers || '1,2' }}
      METAGENTE_PILOT_SCENARIOS: ${{ github.event_name == 'workflow_dispatch' && inputs.scenarios || 'baseline,kill,pause-destination,pause-broker,bad-rows' }}
      METAGENTE_PILOT_BATCH_ROWS: ${{ github.event_name == 'workflow_dispatch' && inputs.batch_rows || '500' }}
      METAGENTE_PILOT_BATCH_BYTES: ${{ github.event_name == 'workflow_dispatch' && inputs.batch_bytes || '262144' }}
      METAGENTE_PILOT_PAUSE: ${{ github.event_name == 'workflow_dispatch' && inputs.pause_seconds || '5' }}
      METAGENTE_PILOT_REPORT: ${{ github.workspace }}/pilot-report.md
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Pilot
        run: cd integration && go test -tags 'integration pilot' -run '^TestThePilot$' -count=1 -timeout 140m -v ./...
      - name: Report
        if: ${{ always() }}
        run: |
          if [ -f pilot-report.md ]; then
            cat pilot-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The pilot wrote no report." >> "$GITHUB_STEP_SUMMARY"
          fi
